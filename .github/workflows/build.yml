name: Build Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Fix gradlew line endings and permissions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dos2unix
          dos2unix gradlew
          chmod +x gradlew
          ls -la gradlew
          head -n 5 gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: bash ./gradlew build --no-daemon --stacktrace --info

      - name: Upload Mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MastCraftVoice-client
          path: build/libs/*.jar
