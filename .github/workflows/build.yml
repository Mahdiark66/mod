name: Build Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dos2unix || true
          dos2unix ./gradlew || true
          chmod +x ./gradlew
          bash ./gradlew build --no-daemon --stacktrace

      - name: Prepare JAR
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/ || true
          ls -la dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MastCraftVoice-client
          path: dist/*.jar

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MastCraftVoice ${{ github.run_number }}
          files: dist/*.jar
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
