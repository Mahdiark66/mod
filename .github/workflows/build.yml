name: Build Forge Mod

on:
push:
branches:
- main
- master
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'
      cache: gradle

  - name: Make Gradle executable
    run: chmod +x ./gradlew

  - name: Build
    run: ./gradlew build --no-daemon

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: MastCraftVoice
      path: build/libs/*.jar
```
