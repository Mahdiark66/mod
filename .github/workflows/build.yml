name: Build Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List files
        run: |
          echo "===== PWD ====="
          pwd
          echo "===== LS ====="
          ls -la
          echo "===== GRADLEW EXISTS? ====="
          ls -la gradlew || echo "gradlew NOT FOUND"
          echo "===== JAVA ====="
          java -version || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Try build
        run: |
          echo "Starting build..."
          if [ -f ./gradlew ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq dos2unix || true
            dos2unix ./gradlew || true
            chmod +x ./gradlew
            bash ./gradlew build --no-daemon --stacktrace
          else
            echo "ERROR: gradlew file is missing!"
            exit 1
          fi

      - name: Upload Mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MastCraftVoice-client
          path: build/libs/*.jar
